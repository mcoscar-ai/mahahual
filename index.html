<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahahual">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="icon_180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon_152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon_120.png">
<title>Guardianes de Mahahual</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100vw; height:100dvh;
    overflow:hidden; background:#000;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #gameCanvas { display:block; touch-action:none; }

  /* Botão de tela cheia */
  #btnFullscreen {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    color: #fff;
    font-size: 22px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    transition: background 0.2s;
  }
  #btnFullscreen:active { background: rgba(255,255,255,0.25); }
  /* Esconde o botão quando já está em fullscreen */
  #btnFullscreen.hidden { display: none; }

  /* Overlay "gire o celular" — jogo é landscape-only */
  #rotateOverlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #0d2b12;
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: sans-serif;
  }
  #rotateOverlay.visible { display: flex; }
  #rotateOverlay .icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: rotateHint 1.6s ease-in-out infinite;
  }
  #rotateOverlay p {
    font-size: 20px;
    font-weight: bold;
    max-width: 320px;
  }
  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Botão de tela cheia — visível até o usuário ativar -->
  <button id="btnFullscreen" title="Pantalla completa">⛶</button>

  <!-- Overlay exibido quando o celular está em pé (portrait) -->
  <div id="rotateOverlay">
    <div class="icon">📱</div>
    <p>¡Gira el celular para jugar!<br>Este juego se ve mejor en horizontal.</p>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/game.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/items.js"></script>
  <script src="js/screens.js"></script>

  <script>
    // ── Botão de tela cheia ──────────────────────────────────
    var btn = document.getElementById('btnFullscreen');

    function ativarFullscreen() {
      var el = document.documentElement;
      if (el.requestFullscreen)            el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
      else if (el.msRequestFullscreen)     el.msRequestFullscreen();
    }

    function sairFullscreen() {
      if (document.exitFullscreen)            document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        sairFullscreen();
      } else {
        ativarFullscreen();
      }
    });

    // Atualiza ícone e visibilidade do botão
    function atualizarBotaoFS() {
      var emFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
      btn.textContent = emFS ? '✕' : '⛶';
    }
    document.addEventListener('fullscreenchange', atualizarBotaoFS);
    document.addEventListener('webkitfullscreenchange', atualizarBotaoFS);

    // ── Forçar altura real no iOS ────────────────────────────
    function fixAltura() {
      document.documentElement.style.height = window.innerHeight + 'px';
      document.body.style.height = window.innerHeight + 'px';
    }
    fixAltura();
    window.addEventListener('resize', fixAltura);

    // ── Aviso "gire o celular" (jogo é landscape-only) ───────
    var rotateOverlay = document.getElementById('rotateOverlay');
    function checkOrientation() {
      var isPortrait = window.innerWidth < window.innerHeight;
      rotateOverlay.classList.toggle('visible', isPortrait);
    }
    checkOrientation();
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', function () {
      setTimeout(checkOrientation, 200);
    });

    // ── Inicializa jogo após assets carregarem ───────────────
    P.y = GROUND_Y;

    // Mostra o erro na tela em vez de deixar tudo preto
    function telaDeErro(msg, detalhe) {
      CTX.fillStyle = '#1a0d0d';
      CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);
      CTX.textAlign = 'center';
      CTX.fillStyle = '#ff8a80';
      CTX.font = 'bold ' + Math.round(CANVAS.height * 0.05) + 'px sans-serif';
      CTX.fillText(msg, CANVAS.width / 2, CANVAS.height * 0.45);
      if (detalhe) {
        CTX.fillStyle = '#ffd9d4';
        CTX.font = Math.round(CANVAS.height * 0.032) + 'px sans-serif';
        CTX.fillText(String(detalhe).slice(0, 90), CANVAS.width / 2, CANVAS.height * 0.55);
      }
      CTX.textAlign = 'left';
    }

    window.addEventListener('error', function (ev) {
      telaDeErro('Error de script', (ev.filename || '') + ' : ' + ev.message);
    });

    // Loop, zonas e progressão agora vivem em game.js
    checkAssetsLoaded(function () {
      if (typeof startGame !== 'function') {
        telaDeErro('js/game.js no se cargó', 'Verifica que el archivo exista en el repositorio');
        return;
      }
      try {
        startGame();
      } catch (err) {
        telaDeErro('Error al iniciar', err && err.message);
      }
    });
  </script>
</body>
</html>
