<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guardiões de Mahahual</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; }
  #gameCanvas { display:block; touch-action:none; }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script>
    // renderer.js já rodou resizeCanvas() e definiu GROUND_Y corretamente
    // agora posiciona o personagem no chão real
    P.y = GROUND_Y;

    checkAssetsLoaded(function () {
      spawnEnemy('bulldozer', 700,  GROUND_Y);
      spawnEnemy('caminhao',  1400, GROUND_Y);
      spawnEnemy('drone',     2100, GROUND_Y);
      spawnEnemy('robot',     2800, GROUND_Y);

      function loop() {
        updateCamera();
        updatePlayer();
        updateEnemies();
        render(1);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
