<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardiões de Mahahual — Teste de Assets</title>
<style>
  body { background:#1a1a1a; color:#fff; font-family: monospace; padding: 20px; }
  #status { font-size: 18px; margin-bottom: 20px; }
  .ok { color: #4caf50; }
  .fail { color: #f44336; }
</style>
</head>
<body>
  <h1>🌿 Guardiões de Mahahual — Teste de Assets</h1>
  <div id="status">Carregando...</div>

  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script>
    checkAssetsLoaded(function () {
      var statusDiv = document.getElementById('status');
      var okCount = ASSETS_TOTAL - ASSETS_FAILED.length;
      if (ASSETS_FAILED.length === 0) {
        statusDiv.innerHTML = '<span class="ok">✅ TODOS os ' + ASSETS_TOTAL + ' assets carregaram certinho!</span>';
      } else {
        statusDiv.innerHTML =
          '<span class="ok">' + okCount + '/' + ASSETS_TOTAL + ' carregaram</span><br>' +
          '<span class="fail">❌ ' + ASSETS_FAILED.length + ' falharam:</span><br>' +
          ASSETS_FAILED.map(function(f){ return '&nbsp;&nbsp;- ' + f; }).join('<br>');
      }
    });
  </script>

  <canvas id="testCanvas" style="background:#8ecf6f; display:block; margin:20px auto; max-width:100%; touch-action:none;"></canvas>
  <script src="js/player.js"></script>
  <script>
    var canvas = document.getElementById('testCanvas');
    var ctx = canvas.getContext('2d');

    function resizeTestCanvas() {
      var w = Math.min(window.innerWidth - 20, 800);
      canvas.width = w;
      canvas.height = w * 0.75; // mantém proporção 4:3
      GROUND_Y = canvas.height - 40; // chão perto da base do canvas visível
      P.y = GROUND_Y;
    }
    resizeTestCanvas();
    window.addEventListener('resize', resizeTestCanvas);

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      var truck = IMAGES['caminhao_move_01'];
      var truckDims = drawSprite(ctx, truck, canvas.width * 0.7, GROUND_Y, SPRITE_TARGET_HEIGHT.truck, 1, 0);

      var maxJumpHeight = (JUMP_FORCE * JUMP_FORCE) / (2 * GRAVITY);
      ctx.strokeStyle = 'red';
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y - maxJumpHeight);
      ctx.lineTo(canvas.width, GROUND_Y - maxJumpHeight);
      ctx.stroke();
      ctx.setLineDash([]);

      updatePlayer();
      drawPlayer(ctx, 0);
      drawFruits(ctx, 0);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
