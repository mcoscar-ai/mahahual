<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardiões de Mahahual — Teste de Assets</title>
<style>
  body { background:#1a1a1a; color:#fff; font-family: monospace; padding: 20px; }
  #status { font-size: 18px; margin-bottom: 20px; }
  .ok { color: #4caf50; }
  .fail { color: #f44336; }
</style>
</head>
<body>
  <h1>🌿 Guardiões de Mahahual — Teste de Assets</h1>
  <div id="status">Carregando...</div>

  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script>
    checkAssetsLoaded(function () {
      var statusDiv = document.getElementById('status');
      var okCount = ASSETS_TOTAL - ASSETS_FAILED.length;
      if (ASSETS_FAILED.length === 0) {
        statusDiv.innerHTML = '<span class="ok">✅ TODOS os ' + ASSETS_TOTAL + ' assets carregaram certinho!</span>';
      } else {
        statusDiv.innerHTML =
          '<span class="ok">' + okCount + '/' + ASSETS_TOTAL + ' carregaram</span><br>' +
          '<span class="fail">❌ ' + ASSETS_FAILED.length + ' falharam:</span><br>' +
          ASSETS_FAILED.map(function(f){ return '&nbsp;&nbsp;- ' + f; }).join('<br>');
      }
    });
  </script>

  <canvas id="testCanvas" width="800" height="600" style="background:#8ecf6f; display:block; margin:20px auto;"></canvas>
  <script src="js/player.js"></script>
  <script>
    var ctx = document.getElementById('testCanvas').getContext('2d');

    function loop() {
      ctx.clearRect(0, 0, 800, 600);

      // Caminhão parado do lado direito, só pra comparar tamanho/altura do pulo
      var truck = IMAGES['caminhao_move_01'];
      if (truck && truck.complete) {
        var tx = 500, ty = GROUND_Y - truck.height;
        ctx.drawImage(truck, tx, ty, truck.width, truck.height);
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText('caminhão: ' + truck.width + '×' + truck.height + 'px', tx, ty - 8);
      }

      // Linha horizontal marcando a altura MÁXIMA que o pulo alcança
      var maxJumpHeight = (JUMP_FORCE * JUMP_FORCE) / (2 * GRAVITY);
      ctx.strokeStyle = 'red';
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y - maxJumpHeight);
      ctx.lineTo(800, GROUND_Y - maxJumpHeight);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'red';
      ctx.fillText('topo do pulo (' + Math.round(maxJumpHeight) + 'px)', 10, GROUND_Y - maxJumpHeight - 6);

      updatePlayer();
      drawPlayer(ctx, 0);
      drawFruits(ctx, 0);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
